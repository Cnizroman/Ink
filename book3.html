<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,noarchive,nosnippet" />
  <title>Где нас нет · Доступ по паролю</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="book3.css" />
  <script src="supabase-config.js" defer></script>
  <script src="legacy-book.js" defer></script>
</head>
<body class="theme-book3">
  <section class="password-overlay" id="book3Gate" aria-labelledby="gateTitle">
    <div class="password-box">
      <a class="close-btn" href="index.html#/catalog" aria-label="Вернуться в каталог">×</a>
      <div class="password-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg></div>
      <h1 id="gateTitle">Где нас нет</h1>
      <p class="book-gate-info">Закрытая история. Текст и голосовое появятся только после проверки пароля сервером.</p>
      <form id="book3AccessForm">
        <label for="book3Password">Пароль от автора</label>
        <input id="book3Password" name="password" type="password" required maxlength="72" autocomplete="off" autofocus />
        <button type="submit">Открыть историю</button>
        <p id="book3AccessStatus" role="status" aria-live="polite"></p>
      </form>
      <p class="book-gate-info">Пароль не сохраняется. После перезагрузки понадобится ввести его снова. Без сети закрытая история недоступна.</p>
      <a href="index.html#/studio/works">Владельцу: изменить пароль в мастерской</a>
      <noscript><p>Для защищённого чтения включите JavaScript.</p></noscript>
    </div>
  </section>
</body>
</html>
